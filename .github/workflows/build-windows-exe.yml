name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build native application
        run: python -m PyInstaller --noconfirm --clean NASCARModdingApp.spec

      - name: Smoke-test packaged application
        shell: pwsh
        run: |
          $process = Start-Process -FilePath '.\dist\NASCARModdingApp\NASCARModdingApp.exe' -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            Get-Content '.\dist\NASCARModdingApp\smoke-test-error.txt' -ErrorAction SilentlyContinue
            throw "Packaged application smoke test failed with exit code $($process.ExitCode)."
          }

      - name: Add release documentation
        shell: pwsh
        run: |
          Copy-Item README_FIRST.txt dist\NASCARModdingApp\README_FIRST.txt
          Copy-Item THIRD_PARTY_NOTICES dist\NASCARModdingApp\THIRD_PARTY_NOTICES.txt
          Copy-Item AUDIO_TOOLS_LICENSE_AND_SOURCE dist\NASCARModdingApp\AUDIO_TOOLS_LICENSE_AND_SOURCE.txt

      - name: Create portable archive
        shell: pwsh
        run: Compress-Archive -Path dist\NASCARModdingApp\* -DestinationPath NASCARModdingApp-Windows-x64.zip

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: NASCARModdingApp-Windows-x64
          path: NASCARModdingApp-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
